title: 이코노준
tagline: 준호씨의 경제노트
description: 개발자 김준호가 생활비를 줄이면서 직접 확인한 것들. 알뜰폰, 통신비, 공모주.

# 공개 주소. CNAME 파일과 짝이다. 가비아 DNS에서 money CNAME → junho85.github.io (2026-10-25)
url: "https://money.junho85.pe.kr"
baseurl: ""

author:
  name: 김준호
  email: junho85@gmail.com

timezone: Asia/Seoul
lang: ko-KR

# 글 목차(TOC) 전체 스위치. 테마는 이것과 글별 toc(defaults 에서 true)가 둘 다 켜져야 목차를 그린다
toc: true

github:
  username: junho85

avatar: /assets/img/avatar.jpg

social:
  name: 김준호
  email: junho85@gmail.com
  links:
    - https://github.com/junho85

theme: jekyll-theme-chirpy

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

plugins:
  - jekyll-archives
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# 글 주소. 카테고리(한글)가 URL에 들어가지 않게 기술 블로그와 같은 형식으로 고정
permalink: /:year/:month/:day/:title.html

paginate: 10
paginate_path: "/page:num/"

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

compress_html:
  ignore:
    envs: development

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - scripts
  - vendor
  - README.md
  - LICENSE
